<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEFT Booking Schedule</title>
<link rel="icon" href="brand/neft-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Shown until the bundle boots; replaced the moment React mounts. */
  #boot {
    display: flex;
    min-height: 60vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #5b6472;
    font-family: Tajawal, ui-sans-serif, system-ui, sans-serif;
  }
  #boot img { height: 44px; width: auto; }
  #boot p { margin: 0; font-size: 14px; }
</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <img src="brand/neft-logo.png" alt="NEFT Energies" />
    <p>Opening the booking register...</p>
  </div>
</div>
<script src="bookings.js"></script>
</body>
</html>
